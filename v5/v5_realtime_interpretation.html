<!--

    DOCUMENTATION:
    - The purpose of this page is to interpret the users speech from one language to another language.
    - This page makes use of the device's microphone and speaker.
    - This page creates a session with Google Gemini Live (Stream realtime) via a WebSocket server.
    
    - WEBSOCKET AUDIO RELAY:
        - The browser captures audio and sends it to the Node.js server.
        - The server relays the audio to the Gemini Live API.
        - The server receives the interpreted audio from Gemini and sends it back to the browser.
        - The browser plays the received audio.

    THE BARGIN PROBLEM: 
    - the Realtime service will cut off if the user starts talking. This is called bargin. it is a result of auto matic turn detection. 
    - An example is: A user speaks a sentence and it's sent to Realtime. Realtime starts streaming the response, however as the user starts speaking agian, the Realtime stream is cut. The user "barged in" 
    - this results in a very unsmooth interpretation experience. 
    - The goal is that the user can continuously speak comfortably, and this page will dynamically handle the audio chunks + Realtime so that all the audio is A) sent to Realtime, and B) the response is played out completely. 


-->

<!-- Working realtime. however bargin is not solved here -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Translation Service</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        window.translatorComponent = function () {
            return {
                ws: null,
                localStream: null,
                audioContext: null,
                processor: null,
                isConnected: false,
                
                apiKey: '',
                prompt: 'Translate this English to Korean',
                statusMessage: 'Ready to start',
                isBusy: false,
                audioQueue: [],
                isPlaying: false,

                init() {
                    const savedApiKey = localStorage.getItem('google-api-key');
                    const savedPrompt = localStorage.getItem('translation-prompt');
                    if (savedApiKey) this.apiKey = savedApiKey;
                    if (savedPrompt) this.prompt = savedPrompt;
                    this.$watch('apiKey', (v) => localStorage.setItem('google-api-key', v));
                    this.$watch('prompt', (v) => localStorage.setItem('translation-prompt', v));
                },

                updateStatus(message) {
                    this.statusMessage = message;
                },

                async toggleSession() {
                    if (!this.isConnected) {
                        await this.startSession();
                    } else {
                        this.stopSession();
                    }
                },

                async startSession() {
                    const prompt = (this.prompt || '').trim();
                    if (!prompt) {
                        this.updateStatus('Please enter a translation prompt');
                        return;
                    }

                    try {
                        this.isBusy = true;
                        this.updateStatus('Connecting to server...');

                        this.ws = new WebSocket(`ws://${window.location.host}`);

                        this.ws.onopen = async () => {
                            this.updateStatus('Requesting microphone...');
                            this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            this.audioContext = new AudioContext();
                            
                            await this.audioContext.audioWorklet.addModule('/v5/audio-processor.js');
                            const audioWorkletNode = new AudioWorkletNode(this.audioContext, 'audio-processor');
                            
                            const source = this.audioContext.createMediaStreamSource(this.localStream);
                            source.connect(audioWorkletNode);
                            audioWorkletNode.connect(this.audioContext.destination);

                            audioWorkletNode.port.onmessage = (event) => {
                                const float32Audio = event.data;
                                const base64Audio = this.float32ToBase64(float32Audio);
                                if (this.isConnected) {
                                    this.ws.send(JSON.stringify({ action: 'audio', audio: base64Audio }));
                                }
                            };

                            this.ws.send(JSON.stringify({ action: 'start', prompt: this.prompt }));
                            this.isConnected = true;
                            this.isBusy = false;
                            this.updateStatus('Connected - Speak now');
                        };

                        this.ws.onmessage = (event) => {
                            const message = JSON.parse(event.data);
                            if (message.type === 'audio') {
                                this.audioQueue.push(this.base64ToArrayBuffer(message.data));
                                if (!this.isPlaying) {
                                    this.playNextAudio();
                                }
                            }
                        };

                        this.ws.onclose = () => {
                            this.updateStatus('Disconnected');
                            this.stopSession();
                        };

                        this.ws.onerror = (error) => {
                            console.error('WebSocket Error:', error);
                            this.updateStatus('Error: Could not connect to the server.');
                            this.isBusy = false;
                            this.isConnected = false;
                        };

                    } catch (error) {
                        console.error('Error starting sessions:', error);
                        this.updateStatus('Error: ' + (error && error.message ? error.message : String(error)));
                        this.isBusy = false;
                        this.stopSession();
                    }
                },

                stopSession() {
                    this.updateStatus('Disconnecting...');
                    if (this.ws) {
                        this.ws.send(JSON.stringify({ action: 'stop' }));
                        this.ws.close();
                        this.ws = null;
                    }
                    if (this.localStream) {
                        this.localStream.getTracks().forEach((track) => track.stop());
                        this.localStream = null;
                    }
                    if (this.audioContext) {
                        this.audioContext.close();
                        this.audioContext = null;
                    }
                    // No need to disconnect processor, it's handled by the audio context closing
                    this.isConnected = false;
                    this.resetUI();
                },

                resetUI() {
                    this.isBusy = false;
                    this.updateStatus('Ready to start');
                },

                float32ToBase64(float32Array) {
                    const pcm16 = new Int16Array(float32Array.length);
                    for (let i = 0; i < float32Array.length; i++) {
                        let s = Math.max(-1, Math.min(1, float32Array[i]));
                        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    const u8 = new Uint8Array(pcm16.buffer);
                    return btoa(String.fromCharCode.apply(null, u8));
                },

                base64ToArrayBuffer(base64) {
                    const binaryString = window.atob(base64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    return bytes.buffer;
                },

                async playNextAudio() {
                    if (this.audioQueue.length === 0) {
                        this.isPlaying = false;
                        return;
                    }
                    this.isPlaying = true;
                    
                    const rawPcmData = this.audioQueue.shift();
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Gemini native audio model outputs 16kHz mono audio.
                    const sampleRate = 16000; 
                    const pcm16 = new Int16Array(rawPcmData);
                    const float32 = new Float32Array(pcm16.length);
                    
                    // Convert 16-bit PCM to 32-bit float
                    for (let i = 0; i < pcm16.length; i++) {
                        float32[i] = pcm16[i] / 32767;
                    }

                    const audioBuffer = audioContext.createBuffer(1, float32.length, sampleRate);
                    audioBuffer.copyToChannel(float32, 0);

                    const source = audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(audioContext.destination);
                    source.start(0);
                    source.onended = () => {
                        audioContext.close();
                        this.playNextAudio();
                    };
                }
            };
        };
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-md" x-data="translatorComponent()">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">
            Real-time Translation
        </h1>
        
        <div class="mb-4">
            <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-2">
                Google API Key
            </label>
            <input 
                type="password" 
                id="apiKey" 
                placeholder="Enter your Google API key"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                x-model="apiKey"
            >
        </div>

        <div class="mb-4">
            <label for="prompt" class="block text-sm font-medium text-gray-700 mb-2">
                Translation Prompt
            </label>
            <textarea 
                id="prompt" 
                rows="3"
                placeholder="e.g., Translate this English to Korean"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 resize-none"
                x-model="prompt"
            ></textarea>
        </div>

        <div class="mb-6">
            <button 
                class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-medium py-3 px-4 rounded-md transition-colors"
                @click="toggleSession()"
                :disabled="isBusy"
                x-text="isConnected ? 'Stop Translation Session' : 'Start Translation Session'"
            ></button>
        </div>

        <div class="mb-6" x-show="localStream">
            <button 
                class="w-full bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-md transition-colors"
                @click="resetState()"
            >
                Reload
            </button>
        </div>

        <div class="text-center text-sm text-gray-600 mb-4" x-text="statusMessage"></div>

        <!-- Audio element is no longer needed for direct playback -->
    </div>
</body>
</html>
